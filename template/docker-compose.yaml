version: "3.9"

# ═══════════════════════════════════════════════════════════
#  Stack : FrankenPHP · Next.js · PostgreSQL · RabbitMQ
#          + Observabilité : Prometheus · Loki · Tempo · Grafana
# ═══════════════════════════════════════════════════════════

services:

  # ───────────────────────────────────────────────────────
  # PostgreSQL
  # ───────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME}_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      logging: "promtail"
      logging_jobname: "postgres"

  # ───────────────────────────────────────────────────────
  # pgAdmin
  # ───────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ${COMPOSE_PROJECT_NAME}_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:              ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD:           ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE:         "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - ./db/pgadmin/data:/var/lib/pgadmin
      - ./db/pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "${PGADMIN_PORT}:80"
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy

  # ───────────────────────────────────────────────────────
  # RabbitMQ
  # ───────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ${COMPOSE_PROJECT_NAME}_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER:  ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS:  ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    labels:
      logging: "promtail"
      logging_jobname: "rabbitmq"

  # ───────────────────────────────────────────────────────
  # Backend — FrankenPHP (remplace Nginx + PHP-FPM)
  # ───────────────────────────────────────────────────────
  back:
    build:
      context: ./back
      dockerfile: Dockerfile
      target: dev
      args:
        FRANKENPHP_VERSION: ${FRANKENPHP_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}_back
    restart: unless-stopped
    environment:
      APP_ENV:                  ${APP_ENV}
      APP_SECRET:               ${APP_SECRET}
      SERVER_NAME:              ${SERVER_NAME}
      DATABASE_URL:             postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8
      MESSENGER_TRANSPORT_DSN:  amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST}
      CORS_ALLOW_ORIGIN:        ${CORS_ALLOW_ORIGIN}
      JWT_SECRET_KEY:           ${JWT_SECRET_KEY}
      JWT_PUBLIC_KEY:           ${JWT_PUBLIC_KEY}
      JWT_PASSPHRASE:           ${JWT_PASSPHRASE}
      # OpenTelemetry → Tempo
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_SERVICE_NAME:        ${COMPOSE_PROJECT_NAME}-back
      OTEL_TRACES_SAMPLER:      parentbased_always_on
    volumes:
      - ./back/app:/var/www/app
      - back_vendor:/var/www/app/vendor
      - ./back/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "${BACK_PORT}:${BACK_PORT}"       # HTTPS (port unique)
      - "${BACK_PORT}:${BACK_PORT}/udp"   # HTTP/3 (QUIC)
    networks:
      - backend
      - frontend
      - observability
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    labels:
      logging: "promtail"
      logging_jobname: "symfony"

  # ───────────────────────────────────────────────────────
  # Frontend — Next.js
  # ───────────────────────────────────────────────────────
  front:
    build:
      context: ./front
      dockerfile: Dockerfile
      target: dev
      args:
        NODE_VERSION: ${NODE_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}_front
    restart: unless-stopped
    environment:
      NODE_ENV:               ${APP_ENV}
      NEXT_PUBLIC_API_URL:    ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_APP_NAME:   ${NEXT_PUBLIC_APP_NAME}
    volumes:
      - ./front/app:/app
      - front_node_modules:/app/node_modules
      - front_next:/app/.next
    ports:
      - "${FRONT_PORT}:3000"
    networks:
      - frontend
    depends_on:
      - back
    labels:
      logging: "promtail"
      logging_jobname: "nextjs"

  # ═══════════════════════════════════════════════════════
  #  OBSERVABILITÉ
  # ═══════════════════════════════════════════════════════

  # ───────────────────────────────────────────────────────
  # Prometheus — collecte des métriques
  # ───────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: ${COMPOSE_PROJECT_NAME}_prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION}
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    networks:
      - observability
      - backend
    labels:
      logging: "promtail"
      logging_jobname: "prometheus"

  # ───────────────────────────────────────────────────────
  # Loki — agrégation des logs
  # ───────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.0.0
    container_name: ${COMPOSE_PROJECT_NAME}_loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    ports:
      - "${LOKI_PORT}:3100"
    networks:
      - observability
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:3100/ready -O /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ───────────────────────────────────────────────────────
  # Promtail — collecte des logs Docker → Loki
  # ───────────────────────────────────────────────────────
  promtail:
    image: grafana/promtail:3.0.0
    container_name: ${COMPOSE_PROJECT_NAME}_promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./observability/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - observability
    depends_on:
      loki:
        condition: service_healthy

  # ───────────────────────────────────────────────────────
  # Tempo — collecte des traces (OTLP)
  # ───────────────────────────────────────────────────────
  tempo:
    image: grafana/tempo:2.4.2
    container_name: ${COMPOSE_PROJECT_NAME}_tempo
    restart: unless-stopped
    command: -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    ports:
      - "${TEMPO_PORT}:3200"       # UI / query
      # Les ports OTLP (4317/4318) ne sont pas exposés sur l'hôte :
      # le container back communique avec tempo via le réseau Docker interne.
    networks:
      - observability
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:3200/ready -O /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ───────────────────────────────────────────────────────
  # Grafana — dashboards unifiés
  # ───────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: ${COMPOSE_PROJECT_NAME}_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_SERVER_ROOT_URL:         http://localhost:${GRAFANA_PORT}
      GF_AUTH_ANONYMOUS_ENABLED:  "false"
      GF_INSTALL_PLUGINS:         grafana-clock-panel,grafana-simple-json-datasource
      # Corrélation logs ↔ traces
      GF_FEATURE_TOGGLES_ENABLE:  traceqlEditor traceToLogs
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    networks:
      - observability
    depends_on:
      - prometheus
      - loki
      - tempo

# ─── Volumes ────────────────────────────────────────────
volumes:
  db_data:
  rabbitmq_data:
  back_vendor:
  front_node_modules:
  front_next:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:

# ─── Réseaux ────────────────────────────────────────────
networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
  observability:
    driver: bridge
