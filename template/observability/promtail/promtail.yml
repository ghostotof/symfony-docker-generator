server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # ── Logs Docker via le socket ────────────────────────
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        # Ne scraper que les containers avec le label logging=promtail
        filters:
          - name: label
            values: [logging=promtail]

    relabel_configs:
      # Utiliser le label logging_jobname comme job Loki
      - source_labels: [__meta_docker_container_label_logging_jobname]
        target_label:  job

      # Nom du container
      - source_labels: [__meta_docker_container_name]
        regex:         /(.*)
        target_label:  container

      # Image Docker
      - source_labels: [__meta_docker_container_image]
        target_label:  image

      # Stream (stdout / stderr)
      - source_labels: [__meta_docker_container_log_stream]
        target_label:  stream

    pipeline_stages:
      # Tenter de parser le JSON (FrankenPHP/Caddy log en JSON)
      - json:
          expressions:
            level:  level
            msg:    msg
            ts:     ts
            logger: logger
          # Ne pas échouer si le log n'est pas JSON
          drop_malformed: false

      # Mapper le champ level sur un label Loki
      - labels:
          level:
          logger:

      # Timestamp depuis le champ ts si présent
      - timestamp:
          source: ts
          format: UnixFloat
          action_on_failure: skip
