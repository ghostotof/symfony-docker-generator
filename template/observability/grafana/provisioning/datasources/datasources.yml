apiVersion: 1

datasources:

  # ── Prometheus ────────────────────────────────────────
  - name:      Prometheus
    type:      prometheus
    uid:       prometheus
    access:    proxy
    url:       http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod:    POST
      exemplarTraceIdDestinations:
        - name:          traceID
          datasourceUid: tempo

  # ── Loki ──────────────────────────────────────────────
  - name:   Loki
    type:   loki
    uid:    loki
    access: proxy
    url:    http://loki:3100
    jsonData:
      derivedFields:
        # Lier trace_id dans les logs aux traces Tempo
        - matcherRegex:   '"trace_id":"(\w+)"'
          name:           TraceID
          url:            "$${__value.raw}"
          datasourceUid:  tempo

  # ── Tempo ─────────────────────────────────────────────
  - name:   Tempo
    type:   tempo
    uid:    tempo
    access: proxy
    url:    http://tempo:3200
    jsonData:
      tracesToLogs:
        datasourceUid: loki
        tags: [job, container]
        mappedTags:
          - key:   service.name
            value: job
        spanStartTimeShift: -1h
        spanEndTimeShift:   1h
        filterByTraceID: true
        filterBySpanID:  false
      serviceMap:
        datasourceUid: prometheus
      search:
        hide: false
      nodeGraph:
        enabled: true
