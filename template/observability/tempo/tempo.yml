server:
  http_listen_port: 3200
  log_level:        info

# Récepteurs de traces (OTLP HTTP + gRPC, Jaeger, Zipkin)
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    jaeger:
      protocols:
        thrift_http:
          endpoint: 0.0.0.0:14268
        grpc:
          endpoint: 0.0.0.0:14250
    zipkin:
      endpoint: 0.0.0.0:9411

ingester:
  trace_idle_period:       10s
  max_block_bytes:         1_000_000
  max_block_duration:      5m

compactor:
  compaction:
    compaction_window:      1h
    max_block_bytes:        100_000_000
    block_retention:        168h          # 7 jours
    compacted_block_retention: 10m

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal
    pool:
      max_workers: 100
      queue_depth:  10000

# Corrélation traces ↔ métriques (génère des métriques depuis les spans)
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
  processors:
    - service-graphs
    - span-metrics

overrides:
  metrics_generator_processors: [service-graphs, span-metrics]

querier:
  frontend_worker:
    frontend_address: tempo:9095

query_frontend:
  search:
    duration_slo:         5s
    throughput_bytes_slo: 1.073741824e+09
  trace_by_id:
    duration_slo: 5s
